system:
  description: >-
    <p>All gnomes have the ability to cast a spell called <em>pass unseen</em>
    once per day. This ability lasts for one turn (10 minutes) and allows the
    gnome to move without leaving any sign of passage at all, including scent or
    footprints, even in snow or mud. During this one turn, the gnome is almost
    invisible (a saving throw is required to spot them). If the gnome makes an
    attack or casts a spell during the spell&rsquo;s duration, the invisibility
    and the tracelessness are both lost.</p>
