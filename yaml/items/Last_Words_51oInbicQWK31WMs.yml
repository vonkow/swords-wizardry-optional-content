    <div class="column">

    <p>This spell can only be cast on someone who is already dead. For the
    duration of the spell, the caster relieves the last moments of the dead
    person&rsquo;s life. The caster sees as the target sees, hears as they hear,
    and can even hear the target&rsquo;s thoughts in their own head. While in
    this state the caster is unaware of the real world around them.</p>

