  description: >-
    <p>This spell imbues the touched person with the power of flight, with a
    movement rate of 120 feet per round. The Referee secretly rolls the 1d6
    additional turns; the player does not know exactly how long the power of
    flight will last. The spell is identical to the third level Magic-User spell
    of the same name; it can be copied from a magic scroll or from the spellbook
    of a Magic-User.</p>
