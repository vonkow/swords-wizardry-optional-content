system:
  description: >-
    <div class="page" title="Page 15">

    <div class="layoutArea">

    <div class="column">

    <p>Elfblades with an Intelligence score of 14 or better can make what is
    known as an arcane parry, using their strange blend of swordplay and magic
    to better defuse the effects of spells targeting them, as shown on the table
    below. The Elfblade can make an arcane parry at any time, without giving up
    the ability to attack or cast a spell&nbsp;in the same round. Area of effect
    spells cannot be parried, but the parry is effective against single-target
    spells aimed at the Elfblade. They must have a one-handed melee weapon in
    hand when using this ability.</p>

