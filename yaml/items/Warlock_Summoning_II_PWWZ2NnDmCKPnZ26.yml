system:
  description: >-
    <p>The Warlock summons allies to serve them until slain or until the spell’s
    duration ends. These servants do not arrive immediately, instead showing up
    1d6 rounds after the spell is cast. The Warlock can summon 1d2 creatures
    with a Challenge Rating of 3, 1d3+1 creatures with a Challenge Rating of 2,
    or 1d4+2 creatures with a Challenge Rating of 1. Lawful Warlocks can only
    summon Lawful or Neutral Creatures. Chaotic Warlocks can only summon Chaotic
    or Neutral creatures. Neutral Warlocks suffer no restriction in the
    alignment of the creatures they summon.</p>
