system:
  description: >-
    <div class="page" title="Page 9">

    <div class="layoutArea">

    <div class="column">

    <p>All Chivalrous Knights are sworn to the service of a liege lord or liege
    lady (in some cases, the oath of fealty is to a temple). They are free to
    adventure at will, but if they receive a summons from the liege they are
    honor-bound to return to the castle (or temple) and serve as commanded. In
    addition, while adventuring, a Chivalric Knight is honor-bound not to
    undertake any quests or perform any deeds that would dishonor their liege or
    be against their liege&rsquo;s interests or holdings. A Chivalric Knight is
    also expected to pay homage to their liege by contributing 10% of all wealth
    earned while they are adventuring to their liege for the betterment of the
    kingdom. If a Chivalric Knight ever knowingly and willingly betrays their
    liege, they are dismissed from service, which causes the loss of 10% of the
    character&rsquo;s experience points if the accusation was just and true.
    Moreover, the character loses the abilities of the Chivalric Knight class,
    and is considered a Fighter for all purposes unless a new liege is willing
    to accept their oath of fealty. The experience points lost as a result of
    dismissal are not regained by entering service with a new liege.</p>

    </div>

    </div>

    </div>
