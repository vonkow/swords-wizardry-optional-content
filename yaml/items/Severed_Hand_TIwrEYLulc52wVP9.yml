system:
  description: >-
    <div class="page" title="Page 45">

    <div class="layoutArea">

    <div class="column">

    <p>This spell causes a semi-corporeal severed hand to appear floating next
    to the caster. The hand will follow the caster&rsquo;s mental commands out
    to the spell&rsquo;s maximum range. The hand flies with the same movement
    rate as the caster&rsquo;s normal movement. The hand cannot lift objects or
    manipulate the physical world, save to make a melee attack as if they were
    the caster themselves. This attack from the spectral hand inflicts 1d4
    damage. Alternatively, the caster can channel any spell they know with a
    range of &ldquo;Touch&rdquo; through the hand, allowing them to cast such
    spells at targets from a great distance. The spectral hand is immune to
    damage from mundane weapons, but is destroyed if targeted by a spell or if
    attacked by someone using a magical weapon. Such attacks made to strike the
    hand must hit AC 3 [16].</p>

    </div>

    </div>

    </div>
