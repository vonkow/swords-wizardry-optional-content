system:
  description: >-
    <p>This spell takes one full hour to cast and may require special or rare
    components at the referee’s discretion. The caster creates a complex
    summoning circle and calls forth a powerful extraplanar being as detailed
    below who agrees to return the Warlock (or one willing target present at the
    time of casting) to life, should they be slain. When the agreement is
    reached, the mortal who has contracted with the extraplanar entity
    permanently loses 1d4 points of Constitution. The creature is not
    necessarily returned to life exactly as they were. It is possible for the
    target to be returned to life with a different ancestry , class or both! The
    target’s alignment and ability scores remain the same and their current
    Experience Point total is used to determine their current level. Roll a d20
    on the table below to determine the target’s new class. If the target’s
    original ancestry is appropriate to that class, then it remains. If not,
    then the referee then randomly determines a new ancestry based on what is
    permitted by that class.</p><p><span class="s1"><strong>CONTRACT CLASS
    TABLE</strong></span></p><p></p><table><tbody><tr><td><p><strong>d20</strong></p></td><td><p><strong>Target
    is Chaotic</strong></p></td><td><p><strong>Target is
    Lawful</strong></p></td><td><p><strong>Target is
    Neutral</strong></p></td></tr><tr><td><p>1</p></td><td><p>Assassin</p></td><td><p>Bard</p></td><td><p>Elfblade</p></td></tr><tr><td><p>2</p></td><td><p>Barbarian</p></td><td><p>Dwarven
    Priest</p></td><td><p>Barbarian</p></td></tr><tr><td><p>3</p></td><td><p>Wrath-chanter</p></td><td><p>Cleric</p></td><td><p>Bard</p></td></tr><tr><td><p>4</p></td><td><p>Cleric</p></td><td><p>Fighter</p></td><td><p>Wrath-chanter</p></td></tr><tr><td><p>5</p></td><td><p>Fighter</p></td><td><p>Cleric</p></td><td><p>Druid</p></td></tr><tr><td><p>6</p></td><td><p>Illusionist</p></td><td><p>Chivalric
