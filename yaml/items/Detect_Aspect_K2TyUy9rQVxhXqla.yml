    <div class="layoutArea">

    <div class="column">

    <p>When this spell is cast, the Warlock can detect the presence of magical
    items or individuals under the influence of a magical spell or effect within
    the spell&rsquo;s range.</p>

    <ul>

    <li><em>Chaos:</em> Chaotic Warlocks also detect the presence of Lawful
    creatures.</li>

    <li><em>Law:</em> Lawful Warlocks also detect the presence of Chaotic
    creatures.</li>

    <li><em>Neutrality:</em> Neutral Warlocks also detect the presence of
    invisible creatures or items.</li>

    </ul>

