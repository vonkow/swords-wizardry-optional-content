system:
  description: >-
    <div class="page" title="Page 45">

    <div class="layoutArea">

    <div class="column">

    <p>The caster, or one person they touch when casting this spell, moves with
    absolute perfect silence as long as they only move at one-half their normal
    movement speed and do not speak above a whisper. Whether or not it is
    possible to whisper when casting a spell is at the Referee&rsquo;s
    discretion. Attacking ends this spell unless the victim of the attack is
    unaware of the attacker and that victim is killed in a single strike. Other
    quick movement or obvious actions end this spell.</p>

