img: systems/swords-wizardry/assets/game-icons-net/two-shadows.svg
system:
  description: >-
    <p>When this spell is cast the Illusionist appears to summon a monster or
    group of monsters whose hit dice total no more than the Illusionist’s level.
    These are not truly summoned monsters, but instead semi-tangible illusionary
    creations that appear identical to the monsters the Illusionist appears to
    summon. Because of the nature of their creation, these demi-shadow monsters
    have one-half of the hit points they otherwise would based on their hit
    dice, always inflict only 1d6 damage regardless of their physical attacks,
    can use none of their special abilities. So, a Demi-Shadow Medusa could not
    use its gaze attack, but a Demi-Shadow dragon could fly or use its breath
    weapon - though all such attacks would only inflict the damage listed above.
    Finally, all Demi-Shadow Monsters have an Armor Class of 8 [11].</p><p
    class="p1">Unlike a <em>Summon Monster</em> spell, Demi-Shadow Monsters
    appear as soon as the spell is cast. If a person viewing the Demi-Shadow
    Monster believes it to be real, they suffer the monster’s normally listed
    damage from physical attacks.</p>
