system:
  description: >-
    <div class="page" title="Page 5">

    <div class="layoutArea">

    <div class="column">

    <p>A Barbarian in a wilderness or underground environment who is given
    enough time to investigate their surroundings can lay an ambush for any foes
    passing through the area. The Barbarian can take into consideration their
    allies when preparing this ambush, but for each additional person receiving
    the benefit of this ability, the Bar- barian&rsquo;s chance of success is
    reduced by -5%, unless those allies are also Barbarians. If the ambush
    effort is successful, the Barbarian (and their allies, if present)
    automatically surprise foes that come within 30 feet of where the ambush has
    been prepared.</p>

