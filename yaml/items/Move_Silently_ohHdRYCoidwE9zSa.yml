    <p><em>Note:</em> Troubadours are proficient thieves and often use skills
    like climb walls or delicate tasks and traps to aid them in their
    performances through acts of uncanny physical prowess or prestidigitation.
    These skills do not benefit from a high Dexterity score. If a Troubadour is
    wearing ring mail or heavier armor while attempting to use any of their
    thieving skills (except Hear Sounds), they suffer a -35% penalty to the
    attempt and if they are making use of a shield they suffer a -15% penalty.
    These penalties are cumulative.</p>
