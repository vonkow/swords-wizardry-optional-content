    duration of the spell expires. The allies do not appear immediately; there
    is a delay of 1d4 rounds before they appear. This spell is not related to
    the Magic-User’s Monster Summoning spells, and cannot be copied from these
    spells or scrolls.</p><table><tbody><tr><td><p><strong>Die Roll
