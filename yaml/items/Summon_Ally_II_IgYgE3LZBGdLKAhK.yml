system:
  description: >-
    <p>The caster summons allies that follow commands until slain or until the
    duration of the spell expires. The allies do not appear immediately; there
    is a delay of 1d4 rounds before they appear. This spell is not related to
    the Magic-User’s Monster Summoning spells, and cannot be copied from these
    spells or scrolls.</p><table><tbody><tr><td><p><strong>Die Roll
    (1d6)</strong></p></td><td><p><strong>Creature
    Summoned</strong></p></td></tr><tr><td><p>1</p></td><td><p>Nothing
    appears</p></td></tr><tr><td><p>2</p></td><td><p>1d4 Berserkers (Human,
    Berserker)</p></td></tr><tr><td><p>3</p></td><td><p>1 <em>Chalkeion
    Hoplite</em></p></td></tr><tr><td><p>4</p></td><td><p>1d4 <em>guard
