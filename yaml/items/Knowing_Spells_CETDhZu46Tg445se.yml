img: systems/swords-wizardry/assets/game-icons-net/spell-book.svg
system:
  description: >-
    <div class="page" title="Page 19">

    <div class="layoutArea">

    <div class="column">

    <p>In <em>Swords &amp; Wizardry</em>, a beginning Necromancer&rsquo;s
    spellbook contains as many of the basic 1st-level spells as the neophyte
    character can know. Check each spell to see if the Necromancer can learn and
    know it, using the &ldquo;Learn Spells&rdquo; column on the table in the
    description of the Intelligence attribute. Each time the Illusionist gains a
    level (if the Referee permits), he or she may re-check the spells not
    understood before, to see if increased experience has granted new
    understanding &mdash; although the Maximum Number of Basic Spells
    Understandable (from the Intelligence Table) is still the upper limit. A
    Necromancer would also still need to find and copy these new
    spells&nbsp;into their spellbook. The same procedure applies to each higher
    spell level: A Necromancer must find the higher-level spells in dungeons or
    musty libraries and copy them into a spellbook, or trade copies with other
    Necromancers. New and unusual spells outside the basic lists are not part of
    the &ldquo;maximum number&rdquo; of knowable spells, although they still
    require a roll to see if the Necromancer can understand one. (Such spells
    are rare and seldom traded.) New spells that a Necromancer researches and
    creates personally are also not subject to the maximum allowable number of
    regular spells.</p>

    </div>

    </div>

    </div>
