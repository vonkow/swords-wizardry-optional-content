system:
  description: >-
    <div title="Page 37" class="page"><div class="layoutArea"><div
    class="column"><p>The caster is masked by an illusion that allows them to
    appear as a humanoid up to one foot taller or one foot shorter than their
    actual self. The caster can also reduce or increase their apparent weight by
    50%. They can also alter their physical features as they see fit, such as
    eye color, hair color, hair length and style, and other distinguishing
    physical features. This includes their wardrobe. These illusionary effects
    are purely visual, affecting no other senses, and provide no physical
    benefits. Those who suspect there to be the presence of an illusion may make
    a saving throw to notice the effect, but otherwise the caster remains
    disguised.</p></div></div></div>
