system:
  description: >-
    <p>The caster and anyone joining hands with them in a circle are transported
    to a different plane of existence. An unwilling target of the spell is
    allowed a saving throw to negate the effect. This spell is ordinarily used
    by Demon Hunters to enter different material planes of existence, or perhaps
    the elemental or ethereal planes. Most Demon Hunters consider their job to
    be a protective one, stopping demonic activity in the places where demons
    don’t belong. Most Demon Hunters agree that the idea of attacking demons in
    the lower planes is a pipe-dream of drunken paladins.</p>
