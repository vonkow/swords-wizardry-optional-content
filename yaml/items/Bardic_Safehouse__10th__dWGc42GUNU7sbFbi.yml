system:
  description: >-
    <div class="page" title="Page 8">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>When a Bard reaches 10th level, they have earned the title of Ollamh, and
    garnered enough goodwill within the society of Bards to draw upon the
    network of their fellows for secret or important information that has passed
    through the network via a web of safehouses. Such safehouses typically
    appear to be a library, tavern, or even museums that a Bard constructs.
    Other Bards will visit this location, providing the Ollamh with rumors and
    vital information on a regular basis and the Ollamh gains the service of 2d6
    Fighters, Thieves, Druids, or Bards (all of whom are 1st level) who will aid
    them as long as the Ollamh&rsquo;s objectives further the goals of the
    secret organization as a whole.</p>

    </div>

