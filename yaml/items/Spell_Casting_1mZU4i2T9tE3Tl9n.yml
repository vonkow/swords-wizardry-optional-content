system:
  description: >-
    <div class="page" title="Page 15">

    <div class="layoutArea">

    <div class="column">

    <p>An Elfblade owns a book of spells, which does not necessarily include all
    of the spells on the standard Magic-User spell lists. Reading from this
    book, Elfblades force selected spell formulae into their minds,
    &ldquo;preparing&rdquo; as many spells as they can mentally sustain. (It is
    possible to prepare a spell multiple times using the available
    &ldquo;slots&rdquo; in the Elfblade&rsquo;s memory and mental capability.)
    Once a prepared spell is cast, it disappears from the Elfblade&rsquo;s
    ability to cast, until it is prepared again. If an Elfblade finds scrolls of
    Magic-User spells while adventuring, these spells can be added to the
    Elfblade&rsquo;s spellbook; there is no difference between the magic of
    Elfblades and that of Magic-users.</p>

    </div>

    </div>

    </div>
