img: systems/swords-wizardry/assets/game-icons-net/rolling-energy.svg
system:
  description: >-
    <p>When this spell is cast, the Warlock can define its shape as either a
    half-sphere that encircles them with a diameter of 30 feet or a straight 60
    long and 20 foot tall wall that begins within 10 feet of the Warlock and
    extends out in a single direction. Any creature not native to the mortal
    plane is unable to cross the break through the wall unless they make a
    successful saving throw. If the creature attempting to cross this wall is of
    the op posite alignment as the Warlock casting this spell, the extraplanar
    creature suffers 1d6 damage per level of the Warlock. If the Warlock is
    Neutral, then any Lawful or Chaotic extraplanar creature attempting to cross
    the ward makes their saving throw at a -4 penalty, but only suffers one
    point of damage per level of the Neutral Warlock when attempting to cross
    the ward. Once an extraplanar has crossed the ward once, they can do so
    freely until the spell ends.</p>
  spellLevel: '3'
  range: 30 ft. radius or 60 ft. wall
  duration: 1 turn per level
