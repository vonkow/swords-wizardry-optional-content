system:
  description: >-
    <p>For the duration of this spell, the Referee adds +2 to all rolls to
    determine if a monster is hostile when the Warlock first encounters them
    (see <em>Swords & Wizardry Complete, Revised </em>pg. 35) if that monster is
    of the same alignment as the Warlock. Unfortunately, the Warlock suffers a
    -2 penalty to this roll if the monster is of the opposite alignment as the
    Warlock.</p>
