system:
  description: >-
    <p><strong>Climbing Walls or Cliffs:</strong> This is the percentage chance
    the Troubadour needs to climb a wall that others cannot climb or perform an
    act of acrobatic contortion. If the wall is more difficult than normal (such
    as being very slick or icy), the Referee may lower the Troubadour&rsquo;s
    chance of success. This ability is only used when trying to climb a wall in
    exceptional circumstances. As a general rule, if a normal person has a
    chance to climb a wall or squeeze through a small area, the Troubadour can
    do it automatically.</p>

