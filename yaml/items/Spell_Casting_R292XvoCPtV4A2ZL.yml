  description: >-
    <div class="page" title="Page 13">

    <div class="layoutArea">

    <div class="column">

    <p>Dwarven Priests cast &ldquo;divine&rdquo; spells from the Cleric spell
    list. Each day, the Dwarven Priest selects and prays for a particular set of
    spells, choosing any spells from the standard Cleric Spell list. Once a
    spell is cast, it cannot be cast again until the next day unless the Dwarven
    Priest prepares (prays for) the spell more than once.</p>

