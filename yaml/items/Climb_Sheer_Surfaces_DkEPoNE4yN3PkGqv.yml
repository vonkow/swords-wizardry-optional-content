    <div class="column">

    <p>This percentage chance is what the Barbarian needs to climb a wall that
    others cannot climb. If the wall is&nbsp;more difficult than normal (very
    slippery, for example), the Referee&nbsp;may lower a Barbarian &rsquo;s
    chances of success. In general, if a normal person has a chance to climb a
    wall, a Barbarian can most likely do&nbsp;it automatically.</p>

