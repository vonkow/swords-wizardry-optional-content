system:
  description: >-
    <div class="page" title="Page 7">

    <div class="layoutArea">

    <div class="column">

    <p>Beginning at 2nd level a Bard can prepare and cast spells in a manner
    identical to the Druid class. Bards cast spells from the Druid spell list.
    Each day the Bard selects and prays for a particular set of spells, choosing
    any spells from the list. Once a spell is cast, it cannot be cast again
    until the next day unless the Bard prepares (prays for) the spell more than
    once.</p>

