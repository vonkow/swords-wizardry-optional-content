name: Major Creation
type: spell
_id: cxH8ls5xH8oPZGtf
img: systems/swords-wizardry/assets/game-icons-net/wood-pile.svg
system:
  description: >-
    <p>When this spell is cast, the Illusionist conjures forth no more than
    thirty pounds per level of cloth, wood, clay, stone, or even metal. Only one
    type of object can be conjured with a casting of this spell. The material
    conjured either appears as raw material (metal ore, felled trees, unspun
    wool, etc.) or simply crafted material (spun cloth, wooden planks, stone
    blocks, gold coins, etc.). If a <em>Dispel Magic</em> spell is cast on the
    material or the spell’s duration expires, the material brought forth by the
    <em>Major Creation</em> vanishes.</p>
  spellLevel: '5'
  range: 120 ft.
  duration: A number of days equal to the Illusionist's level
