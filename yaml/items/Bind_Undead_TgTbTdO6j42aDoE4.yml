img: systems/swords-wizardry/assets/game-icons-net/dark-squad.svg
system:
  description: >-
    <div class="page" title="Page 20">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>Necromancers possess a twisted version of the Cleric&rsquo;s Banish
    Undead ability that allows them to potentially bind any mindless undead they
    encounter to their service. The Necromancer can only target one undead
    creature per use of this ability and if the attempt to use this ability
    fails against that undead creature, the Necromancer must gain a level of
    experience before using it against that same undead creature again. It takes
    one full round to attempt to Bind Undead and the Necromancer can take no
    other action when attempting to do so. The Necromancer targets one mindless
    undead&nbsp;creature within 120 feet, rolls 2d10, then consults the Bind
    Undead Table below to determine the results. If the roll is equal to or
    higher than the number indicated on the Bind Undead Table, the mindless
    undead creature is bound to the Necromancer and serves the Necromancer until
    they are destroyed. A listing of &ldquo;B&rdquo; on the table means the
    Necromancer does not need to roll and can use their Bind Undead ability
    automatically against such an undead creature. This ability cannot be used
    to bind intelligent undead, such as vampires and liches, nor mindless undead
    that have more than 9 hit dice.</p>

    </div>

    </div>

    </div>

    </div>
