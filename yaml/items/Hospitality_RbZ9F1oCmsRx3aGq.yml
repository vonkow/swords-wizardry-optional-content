  description: >-
    <div class="page" title="Page 10">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>A Chivalric Knight who formally announces themselves and introduces
    themselves to a noble or other ruler of a keep or castle can expect to be
    given that ruler&rsquo;s hospitality. As long as the Chivalric Knight keeps
    the peace and does not bring trouble or dishonor to this ruler&rsquo;s name
    or people, they can expect to be given food and board within the castle as
    well as a place at all courtly events. This hospitality lasts for one month
    per level of the Chivalric Knight, but does not necessarily extend to their
    adventuring companions.</p>

    </div>

