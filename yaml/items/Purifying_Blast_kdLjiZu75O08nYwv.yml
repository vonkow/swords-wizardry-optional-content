system:
  description: >-
    <p>A bead-like missile shoots from the caster’s finger to explode at the
    targeted location in a blast of bright light. The burst radius is 20 feet,
    and damage is 1d6 per level of the caster. The blast fills 33,000 cubic feet
    (33 10-foot x 10-foot x 10-foot cubical areas) but shapes itself to the
    available volume. A successful saving throw means that the target takes only
    half damage if the target is of Chaotic alignment. Neutral and
    Lawfully-aligned creatures who succeed at the saving throw take no damage,
    but take full damage if the saving throw fails.</p>
