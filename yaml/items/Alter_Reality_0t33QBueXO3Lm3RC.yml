  description: >-
    <p>This spell must be cast in conjunction with an active illusion spell that
    was cast by the one casting this spell. The previously cast illusion becomes
    real and permanent. Illusions brought to life function independently of the
    caster. Referees should feel free to mitigate abuses of this spell. For
    example, if the Illusionist uses this spell to make a mound of a million
    gold pieces permanent, close examination reveals it to be a worthless
    collection of pyrite counterfeits.</p>
