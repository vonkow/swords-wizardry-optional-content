system:
  description: >-
    <p>Through virtuoso musical performance, a Troubadour can attempt to
    mesmerize any number of targets capable of clearly hearing the musical
    performance, typically no more than 60 feet away. While&nbsp;under the
    effects of this charm the victim does nothing but listen to the Troubadour
    perform, though loud noises or attacks against the victim automatically end
    this effect. Unlike a Bard&rsquo;s Oratory ability, the victim does not need
    to understand the language in which the Troubadour is performing - but the
    Troubadour must have a musical instrument when using this ability. While a
    victim is under the effects of a charm the Troubadour can attempt to implant
    a Suggestion (per the spell) in their mind, though the victim can make a
    successful saving throw vs. spells&nbsp;to resist this attempt and
    automatically break free of the distraction. Strong-willed individuals and
    truly strange creatures are less susceptible to the Troubadour&rsquo;s
    charm, with the Troubadour&rsquo;s chance of success being reduced based on
    the table below.</p>

    <h3>Troubadour Song</h3>

    <table border="1"><colgroup><col><col></colgroup>

    <tbody>

    <tr>

    <td><strong>Creature Type</strong></td>

    <td><strong>Song Modifier</strong></td>

    </tr>

    <tr>

    <td>Humanoids and most monsters</td>

    <td>-5% per hit die or level over 4. (i.e -5% at 5th level/5 HD, -10% at 6th
    level/6 HD)</td>

    </tr>

    <tr>

    <td>Monks</td>

    <td>-10% per hit die of the monk</td>

    </tr>

    <tr>

    <td>Undead</td>

    <td>-10% per hit die of the undead creature</td>

    </tr>

    </tbody>

    </table>

