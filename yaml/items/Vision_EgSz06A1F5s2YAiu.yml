system:
  description: >-
    <p>When this spell is cast, the Illusionist stretches their psyche across
    the cosmos to get the answer to a question that is vexing them. When this
    spell is cast, the Illusionist rolls 2d6. On a 2-6 they are stricken with a
    <em>Quest</em> (per the spell of the same name found on page 67 of
    <em>Swords & Wizardry Complete, Revised</em>) and receive no proper answer.
    On a 7-9 they receive useful information that may or may not be related to
    their question. On a 10 or higher, their question is answered honestly.</p>
