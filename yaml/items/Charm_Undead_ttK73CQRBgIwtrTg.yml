img: systems/swords-wizardry/assets/game-icons-net/stoned-skull.svg
system:
  description: >-
    <p>This spell can be cast on any single undead creature, corporeal or
    incorporeal, sentient or mindless, regardless of their hit dice. Mindless
    undead creatures receive no saving throw to resist the spell, but
    intelligent undead creatures may make a saving throw to overcome the
    effects. Intelligent undead creatures receive a new saving throw to break
    free of the spell every day at midnight. Any undead creature, mindless or
    intelligent, can be set free from its effects by a <em>Dispel Magic
    </em>spell.</p>
