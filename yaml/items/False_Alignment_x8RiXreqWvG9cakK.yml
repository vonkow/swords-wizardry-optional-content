name: False Alignment
type: spell
_id: x8RiXreqWvG9cakK
img: systems/swords-wizardry/assets/game-icons-net/triple-shells.svg
system:
  description: >-
    <p>This spell allows the Warlock to twist an individual’s connection to the
    cosmic forces of Law and Chaos. When it is first cast, the Warlock selects a
    number of targets equal to their level within its range. Unwilling targets
    may make a saving throw to avoid this spell’s effects, but willing targets
    can submit to it freely. Failing this saving throw or submitting willingly
    to this spell’s effect means the Lawful victims are considered to be Chaotic
    for purposes of all magical effects, spells and magic items. This means a
    Lawful character under the <em>False Alignment</em> spell would be affected
    by spells like <em>Protection from Evil </em>and would be detected by spells
    like <em>Detect Evil. </em>This includes weapons that inflict increased
    damage or have a unique effect against a Chaotic character. The reverse is
    true for Chaotic characters and how reversed versions of the above noted
    spells would affect them or how weapons that inflict extra damage or have
    exceptional effects against those who are of Lawful alignment or are
    “good.”. If this spell is cast on a character who is Neutral in alignment,
    roll 1d6. On a 1-3 their false alignment is Lawful and on a 4-6 it is
    Chaotic.</p><p class="p1"><em>False Alignment </em>has no impact on how a
    character is required to act and does not endanger those characters who
    would be negatively impacted if they actually changed their alignment.</p><p
    class="p2"><em>Chaos: </em>Lawful characters suffer a -2 penalty on their
    saving throw to resist this spell when it is cast by a Chaotic
    Warlock.</p><p class="p2"><em>Law:</em> Chaotic characters suffer a -2
    penalty on their saving throw to resist this spell when it is cast by a
    Lawful Warlock.</p><p class="p2"><em>Neutrality</em>: Neutral Warlocks also
    detect the true alignment of all targets who fail their saving throw to
    resist this spell.</p>
