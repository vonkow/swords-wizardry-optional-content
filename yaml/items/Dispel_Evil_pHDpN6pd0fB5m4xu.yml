name: Dispel Evil
type: spell
_id: pHDpN6pd0fB5m4xu
img: systems/swords-wizardry/assets/game-icons-net/unstable-orb.svg
system:
  description: >-
    <p>This spell is similar to the Magic-User spell dispel magic, but affects
    only evil magic. Also unlike the dispel magic spell, dispel evil functions
    (temporarily) against evil “sendings,” possibly including dreams or
    supernatural hunting-beasts. The power of an evil magic item is held in
    abeyance for 10 minutes rather than being permanently dispelled. Evil spells
    are completely destroyed.</p><p class="p1">As with dispel magic, the chance
    of successfully dispelling evil is a percentage based on the ratio of the
    level of the dispelling caster over the level of original caster (or hit
    dice of the monster). Thus, a 9th-level Demon Hunter attempting to dispel an
    evil charm cast by a 12th-level caster has a 75% chance of success (9/12 =
    0.75, or 75%). If a 12th-level Demon Hunter was dispelling a 9th-level
    Caster’s charm, success would be certain (12/9 = 1.33, or 133%).</p>
  spellLevel: '5'
  range: 30 feet
  duration: 10 minutes against an item
