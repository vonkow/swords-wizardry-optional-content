img: modules/swords-wizardry-content/images/game-icons-net/magick-trick.svg
system:
  description: >-
    <p>Unlike a Magic-user or Illusionist, a Troubadour does not begin play with
    a spellbook or knowing any spells. They do not automatically gain the
    knowledge of new spells simply by advancing in level. They must find or
    purchase a spellbook and then learn spells through finding and scribing them
    into their spellbook or through means appropriate to each individual
    campaign. This is most often done through the discovery of scrolls
    containing illusionist spells. They must still check to Learn Spells when
    attempting to learn an illusionist spell from a scroll. Troubadours are not
    capable of memorizing or casting additional spells for advancing beyond 12th
    level.</p>
