system:
  description: >-
    <div class="page" title="Page 48">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>This spell alters one person touched by the caster, depending on the
    Warlock&rsquo;s alignment as detailed below.</p>

    <ul>

    <li><em>Chaos:</em> The Chaotic Warlock increases the target&rsquo;s
    Strength by 1d3+1, to a maximum of 18.</li>

    <li><em>Law:</em> The Lawful Warlock heals the target of 1d6+1 damage.</li>

    <li><em>Neutrality:</em> The Neutral Warlock sharpens the target&rsquo;s
    senses, increasing their chance to search for secret doors by 1-3 on 1d6 and
    preventing them from being surprised. Determine the bonus by rolling 1d3
    when the spell is cast; elves may have a 6 in 6 (100%) chance to find secret
    doors under the spell's influence.</li>

    </ul>

    </div>

    </div>

    </div>

    </div>
