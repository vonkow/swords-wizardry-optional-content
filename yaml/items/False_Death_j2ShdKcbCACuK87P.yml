    <div class="column">

    <p>The Necromancer or one willing target they can touch falls into a
    death-like coma for a length of time or condition determined by the
    Necromancer, up to the spell&rsquo;s duration. All mundane and magical
    inquires falsely affirm the target of this spell is dead. When the
    predetermined time or condition is reached or spell&rsquo;s duration ends,
    the tar- get awakens as if from a deep sleep. This spell cannot be cast on
    unwilling targets or non-living creatures.</p>

