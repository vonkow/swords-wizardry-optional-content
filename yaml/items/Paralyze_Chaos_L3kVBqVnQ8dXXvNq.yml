name: Paralyze Chaos
type: spell
_id: L3kVBqVnQ8dXXvNq
img: systems/swords-wizardry/assets/game-icons-net/stop-sign.svg
system:
  description: >-
    <div class="page" title="Page 33">

    <div class="layoutArea">

    <div class="column">

    <p>This spell is similar to the <em>hold person</em> spell, but does not
    affect those of Lawful alignment, and is more easily shaken off by those of
    Neutral alignment. The caster targets 1d4 persons (according to the same
    parameters as the charm person spell). It functions as per <em>hold
    person</em> against those of Chaotic alignment (a saving throw negates the
    effect, and is made at a -2 penalty if only one person is targeted). Anyone
    of Neutral alignment gains a +2 against the saving throw, so if the spell is
    targeted on a group there is a +2 bonus on the save, and if it is targeted
    against one individual the saving throw is made with no bonus or penalty.
    Anyone failing the saving throw is immobilized for the duration of the
    spell.</p>

    <div class="page" title="Page 33">

    <div class="layoutArea">

    <div class="column">

    <p>This spell can only be copied from a Demon Hunter&rsquo;s spellbook or
    scroll; despite the similarity of the <em>hold person</em> spell, it cannot
    be copied as <em>paralyze chaos</em>.</p>

    </div>

    </div>

    </div>

    </div>

    </div>

    </div>
