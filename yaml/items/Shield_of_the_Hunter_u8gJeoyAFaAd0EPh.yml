img: systems/swords-wizardry/assets/game-icons-net/slashed-shield.svg
system:
  description: >-
    <p>The caster is protected by an invisible shield, much like that summoned
    by the Magic-User’s shield spell. The Shield of the Hunter gives opponents a
    -4 penalty to hit the caster, and gives the caster a +2 bonus on all saving
    throws against attacks (including area-of-effect spells). The effect of the
    spell is cumulative (“stacks with”) any other spell that does not specify a
    non-cumulative effect. Shield of the Hunter provides complete protection
    against a <em>magic missile</em> spell.</p>
