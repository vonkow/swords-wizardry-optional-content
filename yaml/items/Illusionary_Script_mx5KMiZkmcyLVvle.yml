img: systems/swords-wizardry/assets/game-icons-net/scroll-quill.svg
system:
  description: >-
    <p>When this spell is cast, the Illusionist can write up to one page per
    level of a magical script that can only be seen by the caster and others
    they designate at the time of casting. Anyone other than the caster or those
    who were designated as being able to read the script that attempt to read it
    must make a saving throw or they suffer the full effects of a <em>Confusion
    </em>spell (see <em>Swords & Wizardry Complete, Revised, </em>pg. 56) for
    1d6 rounds. Illusionary script can be removed by <em>Dispel Illusion</em> or
    <em>Dispel Magic.</em></p>
  spellLevel: '3'
  range: One page of text written by the caster
  duration: Permanent until dispelled
  requiresSave: false
