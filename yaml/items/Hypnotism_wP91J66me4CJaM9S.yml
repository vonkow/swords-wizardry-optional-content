  description: >-
    <div class="page" title="Page 38">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>This spell may only be cast at a single target within 80 feet of the
    caster. The target must be able to look the caster in the eyes and can only
    affect living bipeds of human size or smaller. If the victim fails a saving
    throw vs. spells (made with a +2 bonus), then the caster can give them one
    command which they will immediately attempt to carry out. Any command short
    of suicide may be given, but if the implanted suggestion goes against the
    victim&rsquo;s alignment, personal ideology, or would put them in mortal
    danger they receive a new saving throw the moment before they carry out the
    action (also made with a +2 bonus) to end the spell&rsquo;s effects. The
    spell&rsquo;s effects also end immediately after they have carried out the
    Illusionist&rsquo;s edict.</p>

    </div>

    </div>

    </div>

    </div>
