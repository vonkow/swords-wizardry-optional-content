system:
  description: >-
    <p>This spell wards the touched creature (or the caster) against
    energy-draining effects from any source, not just vampires. The spell
    operates much like magic resistance; the spell’s recipient has a 75% chance
    to be completely unaffected by the energy-draining effect. If the spell does
    not protect the recipient, they can still make any saving throws to avoid
    the effect normally.</p>
