system:
  description: >-
    <div class="page" title="Page 20">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>When a Necromancer reaches 11th level they earn the title of Necromancer,
    and can build a personal lair that is typically an abandoned crypt or
    mausoleum&nbsp;located in or near a graveyard or cemetery - though a few
    Necromancers build isolated towers far from civilized areas who would
    certainly drive them out with torch and pitchfork. Mindless undead that rise
    to unlife in this area will be drawn to the Necromancer and serve them as if
    the Necromancer had crafted or raised these abominations themselves.
    Intelligent undead in the area may forge an alliance with the Necromancer,
    but are equally likely to view the Necromancer as a threat to their own
    power to be betrayed or destroyed at the first opportunity.</p>

    </div>

