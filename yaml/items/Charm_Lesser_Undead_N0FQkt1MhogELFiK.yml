    4 or fewer hit dice like skeletons, zombies, and wights. Each time it is
    cast, the Necromancer selects one such creature within the spell&rsquo;s
    range. If the target fail their saving throw their saving throw, they regard
    the Necromancer as their ally and master and follow their commands until a
    Dispel Magic spell is cast on the undead creature or until it is slain.</p>

