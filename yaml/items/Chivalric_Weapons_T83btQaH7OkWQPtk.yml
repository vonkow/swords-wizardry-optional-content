  description: >-
    <div class="page" title="Page 10">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>When fighting from horseback, the Chivalric Knight receives a +2 bonus on
    all attack rolls as long as they are wielding a longsword, mace, or lance.
    This bonus is reduced to +1 when fighting on foot. In addition, when making
    a melee attack with a lance while mounted, if that mount has already moved
    at least 30 feet during the combat round, the lance inflicts double damage
    on a successful attack.</p>

