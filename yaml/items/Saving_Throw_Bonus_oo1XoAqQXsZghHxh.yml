system:
  description: >-
    <div class="page" title="Page 13">

    <div class="layoutArea">

    <div class="column">

    <p>Dwarven Priests receive a +2 bonus on all saving throws to resist mind
    influencing magical effects, such as <em>Charm Person</em> and <em>Fear</em>
    spells. This includes any magic items or spell-like abilities that function
    similarly to these spells. The saving throw bonus is in addition to the +4
    dwarven saving throw bonus against magic, so a Dwarven Priest has a +6 bonus
    against a Charm Person spell.</p>

    </div>

    </div>

    </div>
