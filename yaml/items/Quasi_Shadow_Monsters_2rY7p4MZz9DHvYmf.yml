img: systems/swords-wizardry/assets/game-icons-net/two-shadows.svg
system:
  description: >-
    <p>When this spell is cast the Illusionist appears to summon a monster or
    group of monsters whose hit dice total no more than twice the Illusionist’s
    level. These are not truly summoned monsters, but instead semi-tangible
    illusionary creations that appear identical to the monsters the Illusionist
    appears to summon. Because of the nature of their creation, these
    quasi-shadow monsters have three-quarters of the hit points they otherwise
    would based on their hit dice, always inflict only 1d6 damage regardless of
    their physical attacks, and can use none of their special abilities. So, a
    Quasi-Shadow Medusa could not use its gaze attack, but a Quasi-Shadow Dragon
    could fly or use its breath weapon - though all such attacks would only
    inflict the damage listed above. Finally, all Quasi-Shadow Monsters have an
    Armor Class of 7 [12].</p><p class="p1">Unlike a <em>Summon Monster</em>
    spell, Quasi-Shadow Monsters appear as soon as the spell is cast. If a
    person viewing the Quasi-Shadow Monster believes it to be real, they suffer
    the monster’s normally listed damage from physical attacks.</p>
