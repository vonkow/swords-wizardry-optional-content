system:
  description: >-
    <p>The Demon Hunter’s touch makes normal animals (including giant versions)
    able to hit creatures that can normally only be hit with +1 magical weapons.
    The spell does not grant an actual bonus to hit, nor is it powerful enough
    to allow the animal to hit a creature that requires a +2 magic weapon or
    better to hit. The spell can affect 3 hit dice of creatures, plus an
    additional hit die for every 2 levels the caster is above third level
    (additional hit die at level 5, 7, 9, etc.). Any creature with less than a
    full hit die is treated as having one hit die.</p>
