system:
  description: >-
    <p>The caster can touch any living target and inflict 1d10 damage with a
    successful melee attack. This attack roll is made with a +2 bonus. The
    caster is healed a number of hit points equal to the damage inflicted by
    this touch, but cannot exceed their maximum hit points. In addition, any
    living being who suffers damage from the vampiric touch must make a saving
    throw or lose a level. This lost level can be restored with a
    <em>Restoration </em>spell.</p>
  spellLevel: '5'
  range: Touch
  duration: 1 round, plus one round per level of the caster
