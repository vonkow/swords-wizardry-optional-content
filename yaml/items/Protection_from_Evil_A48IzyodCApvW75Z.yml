system:
  description: >-
    <div class="page" title="Page 33">

    <div class="layoutArea">

    <div class="column">

    <p>Creates a magical field of protection immediately around the caster,
    blocking out all enchanted monsters such as elementals and demons). Evil
    monsters suffer a &ndash;1 penalty to hit the caster, and the caster gains
    +1 on all saving throws against such attacks. If the caster already has any
    magical bonuses to saving throws or armor class, the bonus from the magic
    circle has no effect, although the protective circle still functions against
    enchanted creatures. This spell is identical to the Clerical version, and
    can be copied into the Demon Hunter&rsquo;s spellbook from a
    Magic-User&rsquo;s spellbook, a Magic-User&rsquo;s scroll, or a Clerical
    scroll</p>

    </div>

    </div>

    </div>
