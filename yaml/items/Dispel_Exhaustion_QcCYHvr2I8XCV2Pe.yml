name: Dispel Exhaustion
type: spell
_id: QcCYHvr2I8XCV2Pe
img: systems/swords-wizardry/assets/game-icons-net/energise.svg
system:
  description: >-
    <p>For the duration of this spell the recipient is filled with a false sense
    of vigor and energy. While under its effects the target suffers no penalties
    from exhaustion, sleep deprivation, or physical weariness. This includes the
    ability for badly wounded individuals or even those who have been recently
    raised from the dead to move normally, though doing so in such conditions is
    painful and inflicts 1d6 damage when they first do so. After this spell
    wears off the target must rest for twice as long as they were under its
    effects.</p>
  spellLevel: '3'
  range: Touch
  duration: Three hours, plus one hour per caster level
