img: systems/swords-wizardry/assets/game-icons-net/frayed-arrow.svg
system:
  description: >-
    <div class="page" title="Page 48">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>The Warlock rips one or more bolts of planar energy from across the
    cosmos and launches it unerringly at a target within the spell&rsquo;s
    range. The caster can conjure a second bolt at 3rd level and a maximum of
    three bolts at 6th level. Each bolt can be launched at a separate target if
    the Warlock so chooses. These bolts automatically hit the target for 1d4+1
    damage each, but have an additional effect detailed below.</p>

    <ul>

    <li><em>Chaos:</em> The planar bolts of a Chaotic Warlock inflict 2d4+2
    damage each against Lawful Clerics, Paladins, and Lawful extraplanar
    creatures (like angelic beings).</li>

    <li><em style="font-family: var(--font-primary); font-size:
    0.875rem;">Law:</em><span style="font-family: var(--font-primary);
    font-size: 0.875rem;"> The planar bolts of a Lawful Warlock inflict 2d4+2
    damage each against undead and demons.</span></li>

    <li><em style="font-family: var(--font-primary); font-size:
    0.875rem;">Neutrality:</em><span style="font-family: var(--font-primary);
    font-size: 0.875rem;"> The planar bolts of a Neutral Warlock inflict 1d6+1
    against all creatures of Lawful or Chaotic alignment.</span></li>

    </ul>

    </div>

    </div>

    </div>

    </div>
