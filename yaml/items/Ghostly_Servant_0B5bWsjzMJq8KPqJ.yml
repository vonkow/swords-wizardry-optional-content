system:
  description: >-
    <div class="page" title="Page 44">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>This spell calls forth a weak, incoporeal spirit that temporarily serves
    the Necromancer, obeying their commands. It cannot go more than 240 feet
    from the caster during its time&nbsp;of service. Though not capable of
    partici- pating in combat, it can fly at human speed and can manipulate the
    physical world as if it had a Strength of 10. This includes carrying
    objects, flipping switches, pulling levers, and other basic meneal tasks. It
    appears as a pale, glowng cloud. Though it cannot be injured, it can be
    destroyed via a Dispel Magic spell.</p>

    </div>

