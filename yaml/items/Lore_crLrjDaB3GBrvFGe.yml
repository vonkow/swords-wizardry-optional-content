system:
  description: >-
    <div class="page" title="Page 8">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>Bards have received a masterful education in ancient legends, forgotten
    lore, and myths that have been obscured by history. This is reflected in
    their Lore ability. In addition to being able to use this ability to
    decipher unknown languages, secret cyphers, and dead languages, a Bard can
    also use the Lore ability to recall the history surrounding an item or place
    that they can personally investigate or study in depth. Whenever a Bard has
    at least one turn to examine and personally handle a magical item, a
    successful use of the Lore ability will allow them to recall any legends or
    historically significant facts regarding that item or place. It is important
    to note that this does not necessarily identify the specific properties of a
    magic item, but may provide hints as to those properties.</p>

    <p>For example, a Bard who has successfully used the Lore ability while
    examining a tattered black flag found in an abandoned castle may be able to
    identify it as the banner of the Blackscale line of nobles who held their
    seat of power in Ebonfog Castle. They would not, however, be able to
    discover that it also functions as a Cloak of Protection+1.</p>

    <p>This ability can also be used to recall the general history of some lo-
    cations. Particularly obscure areas of knowledge or all-but-forgotten pieces
    of history impose a penalty on this Lore check that can range from -5% (for
    slightly obscure information) to -75% or higher (for tales no mortal was
    ever meant to know). Some Referees may choose&nbsp;to make a Bard&rsquo;s
    Lore check in secret and if the die roll fails, could provide the Bard with
    false or misleading information.</p>

