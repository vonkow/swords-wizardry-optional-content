system:
  description: >-
    <p><strong>Delicate Tasks:&nbsp;</strong>This percentage chance is used for
    disabling small mechanical traps, picking pockets, or performing acts of
    sleight of hand (such as making a coin &ldquo;vanish&rdquo; with a wave of
    your hand, and slip it up the Troubadour&rsquo;s sleeve). It is also used to
    detect the mechanisms that activate a trap or notice when feats of sleight
    of hand are being performed.</p>

