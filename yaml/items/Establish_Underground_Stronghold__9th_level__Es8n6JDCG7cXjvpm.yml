  description: >-
    <div class="page" title="Page 13">

    <div class="layoutArea">

    <div class="column">

    <p>When the Dwarven Priest reaches 9th level they can establish a stronghold
    in a vast cavern or underground location. This must include a fortified
    temple. Once established, dwarves will come from the surrounding area and
    establish a community within the stronghold under the Dwarven Priest&rsquo;s
    leadership, who can take the title of &ldquo;Thain.&rdquo; This community
    will include armorers, blacksmiths, siege or construction engineers,
    men-at-arms, and ordinary citizens who are all dwarves.</p>

