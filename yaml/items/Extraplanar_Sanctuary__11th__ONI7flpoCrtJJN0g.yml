system:
  description: >-
    <p>At 11th level, the Warlock can build&nbsp;a shrine, stone circle, or
    infernal altar that acts as a personal portal&nbsp;to an extraplanar pocket
    to serve as their sanctuary. This sanctuary is approximately the same size
    as a castle, but its exact size and nature are determined by the Warlock -
    with approval from the Referee. Extraplanar creatures may or may not notice
    this sanctuary and depending on their inactions with the Warlock, may become
    allies, adversaries, or develop a different type of relationship.</p>
