system:
  description: >-
    <div class="page" title="Page 19">

    <div class="layoutArea">

    <div class="column">

    <p>Like the Magic-User, a Necromancer owns a book of spells, which does not
    necessarily include all the spells on the Necromancer spell list. Reading
    from this book, Necromancers force selected spell formulae into their minds,
    &ldquo;preparing&rdquo; as many spells as the Necromancer can mentally
    sustain. (It is possible to prepare a spell multiple times using the
    available &ldquo;slots&rdquo; in the Necromancer&rsquo;s memory and mental
    capability.) Once a prepared spell is cast, it disappears from the
    Necromancer&rsquo;s ability to cast, until it is prepared again. If a
    Necromancer finds scrolls of spells (either Necromancer spells, Cleric
    Spells, or Magic-User spells that are also part of the Necromancer spell
    list) while adventuring, these spells can be added to the
    Necromancer&rsquo;s spellbook.</p>

    </div>

    </div>

    </div>
