system:
  description: >-
    <p>This spell functions exactly like the third level spell <em>Spectral
    Force</em>, except it can be given a specific set of instructions that does
    not require the Illusionist who cast the spell to concentrate or even be
    present. So, for example, the Illusionist may cast this spell to create an
    illusionary dragon that it commands to fly over a village, circle the town
    square three times, land in that town square and let out a bloodcurdling
    cry, then fly off towards the horizon. The illusion can be given any
    instructions that do not require direct interaction with anything or anyone
    physical and do not exceed the spell’s duration.</p>
