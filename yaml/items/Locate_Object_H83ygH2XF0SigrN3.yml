system:
  description: >-
    <p>Within the spell’s range, the caster perceives the correct direction (as
    the crow flies) toward an object the caster specifies by description in the
    spell. The object must be something the caster has seen, although the spell
    can detect an object in a general class of items known to the caster:
    stairs, gold, etc. This spell is identical to the Magic-User spell of the
    same name, and can by copied from the spellbook of a Magic-User (or from a
    scroll).</p>
