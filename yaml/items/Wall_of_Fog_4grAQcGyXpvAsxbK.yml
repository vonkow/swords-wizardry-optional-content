system:
  description: >-
    <div class="page" title="Page 38">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>This spell creates a wall of opaque fog that can be up to 60 feet long
    and 20 feet high or a circle of opaque fog 30 in diameter and 20 feet high
    when it is cast, as determined by the caster. Vision is blocked and high
    winds do not disperse the fog, though it dissipates when the caster ceases
    to concentrate. The caster can perform no significant actions beyond moving
    at a cautious movement rate while concentrating.</p>

    </div>

    </div>

    </div>

    </div>
