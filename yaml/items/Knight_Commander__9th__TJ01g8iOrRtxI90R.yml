system:
  description: >-
    <div class="page" title="Page 10">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>Upon reaching 9th level, the Chivalric Knight can build a keep or castle
    and take the title &ldquo;Knight-Commander.&rdquo; Once this keep or castle
    is completed, the Knight Commander will draw a household staff to manage the
    estate, and over time vassals and locals will arrive to build a life under
    the Knight-Commander&rsquo;s rule. In addition to the revenue generated from
    this community (levied through taxes), and a standard selection of
    men-at-arms to serve in the castle and as community militia, 1d4+2 Chivalric
    Knights of 1st level will arrive, swearing fealty to the Knight-Commander as
    their liege.</p>

    </div>

    </div>

