  description: >-
    <div class="page" title="Page 16">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>At 9th level, an Elfblade may establish a stronghold in elvish territory
    (or claim territory in the name of elfdom) and attract a body of elven and
    half-elven followers. This will include a small contingent of elven
    Fighters, Magic-Users, and a handful of low-level Elfblades, but will
    consist primarily of ordinary elves who will regard the Elfblade as their
    liege. As the Elfblade&rsquo;s power and influence increases, they may draw
    more followers, but are equally likely to get drawn into the centuries-old
    political squabbles of the elvish people.</p>

    </div>

