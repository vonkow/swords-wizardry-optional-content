system:
  description: >-
    <p>This spell operates like the reverse of the spell bless. In the area of
    effect, 2d6 targets receive a -1 penalty to attack rolls (and reduces their
    morale by 1 point). Unlike the bless spell, a minor ward can be cast on
    creatures who are already in combat. The spell does not affect creatures of
    Lawful alignment.</p>
