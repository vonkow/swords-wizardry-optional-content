  description: >-
    <div class="page" title="Page 18">

    <div class="section">

    <div class="layoutArea">

    <div class="column">

    <p>When an Illusionist reaches 11th level they earn the title of Grand
    Illusionist and can build a personal tower where they can study the strange
    arcane theories surrounding illusion magic. While few sane folks would dare
    live so close to a power eccentric prestidigitator, the Grand Illusionist
    may draw the service of a young apprentice Illusionist, a handful of strange
    fey creatures, or even a truly reckless thief. The exact nature of the
    followers who arrive is dependent on exactly where the Illusionist builds
    their laboratory and how they interact with the surrounding land and its
    residents.</p>

