img: systems/swords-wizardry/assets/game-icons-net/spell-book.svg
system:
  description: >-
    <div class="page" title="Page 17">

    <div class="layoutArea">

    <div class="column">

    <p>In <em>Swords &amp; Wizardry</em>, a beginning Illusionist&rsquo;s
    spellbook contains as many of the basic 1st-level spells as the neophyte
    character can know. Check each spell to see if the Illusionist can learn and
    know it, using the &ldquo;Learn Spells&rdquo; column on the table in the
    description of the Intelligence attribute. Each time the Illusionist gains a
    level (if the Referee permits), he or she may re-check the spells not
    understood before, to see if increased experience has granted new
    understanding &mdash; although the Maximum Number of Basic Spells
    Understandable (from the Intelligence Table) is still the upper limit. An
    Illusionist would also still need to find and copy these new spells into his
    or her spellbook. The same procedure applies to each higher spell level: An
    Illusionist must find the higher-level spells in dungeons or musty libraries
    and copy them into a spellbook, or trade copies with other Illusionists. New
    and unusual spells outside the basic lists are not part of the
    &ldquo;maximum number&rdquo; of knowable spells, although they still require
    a roll to see if an Illusionist can understand one. (Such spells are rare
    and seldom traded.) New spells that an Illusionist researches and creates
    personally are also not subject to the maximum allowable number of regular
    spells.</p>

    </div>

    </div>

    </div>
