system:
  description: >-
    <p>Upon reaching 8th level, the Wrath-chanter can build a small outpost,
    typically a wooden fort or holdfast some distance from civilization. Over
    the next few months a band of 2d6+3 Berserkers and 1st level Wrath-chanters
    will arrive in an effort to join the Wrath-chanter in raids and mercenary
    work across the land. If not provided with ample opportunity to engage in
    warfare, they may abandon the Wrath-chanter or even turn on them and attempt
    to take the holdfast for themselves.</p>
