system:
  description: >-
    <p>This spell is more powerful than the Magic-User spell of the same name
    (see <em>Swords & Wizardry Complete, Revised</em>, pg. 54) that animates
    skeletons or zombies from dead bodies. In the Necromancer’s version of the
    spell, 1d6+1 undead are animated per level of the caster above 6th. The
    corpses remain animated and under the control of the caster until slain.</p>
