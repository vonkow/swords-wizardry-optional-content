system:
  description: >-
    <div class="page" title="Page 6">

    <div class="layoutArea">

    <div class="column">

    <p>Barbarians receive a +2 bonus on all saving&nbsp;throws made to avoid
    traps, both mundane and magical. Against a trap that offers no saving throw,
    the barbarian receives a saving throw to lessen or escape the result of the
    trap (Referee&rsquo;s discretion),&nbsp;although the saving throw against a
    &ldquo;no saving throw&rdquo; trap is made with a -4 penalty. This ability
    represents the fact that the barbarian&nbsp;has an intuitive sense for
    dangers and threats.</p>

    </div>

    </div>

    </div>
