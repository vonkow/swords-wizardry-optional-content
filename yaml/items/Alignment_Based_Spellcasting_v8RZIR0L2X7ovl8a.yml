img: systems/swords-wizardry/assets/game-icons-net/life-in-the-balance.svg
system:
  description: >-
    <p>Unlike other spellcasters, Warlocks do not prepare or memorize spells. If
    a Warlock has the available spells per day as determined by their level and
    shown on the Warlock Advancement Table, then they can select and cast spells
    from the Warlock Spell List. Some Warlock spells have unique effects based
    on the Warlock&rsquo;s alignment. When a Warlock casts a spell with such a
    distinction, this alignment-specific effect is what happens. A Lawful
    Warlock cannot cast a spell to achieve a noted effect tied to Chaos or
    Neutrality, for example. Warlocks do not keep spellbooks, nor do they pray
    for spells.</p>
