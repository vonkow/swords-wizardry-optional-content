system:
  description: >-
    <div class="page" title="Page 7">

    <div class="layoutArea">

    <div class="column">

    <p>Bards are master storytellers and can use their gifts of rhyme, spoken
    word, and song to captivate an audience. The Bard must be able to speak and
    continue speaking for this ability to remain in effect. They can target any
    number of targets who understand the language they are speaking who are
    within 60 feet. While under the effects of a Bard&rsquo;s Oratory ability,
    victims do nothing but listen to the Bard&rsquo;s tale if the Bard rolls
    equal to or under their Oratory percentage, though significant distractions
    (ranging from loud noises to being attacked) automatically end this effect.
    While the victim is under the effects of this ability the Bard can weave a
    story that will implant a Suggestion (per the spell) in the minds of those
    listening. Only one shared Suggestion can be planted in the mind of the
    victims hearing the story and they may make a saving throw vs. spells to
    resist this effect. Strong-willed individuals and truly strange creatures
    are less susceptible to the bard&rsquo;s Oratory, with their chance of
    success reduced as defined on the table below. Creatures immune to
    mind-influencing magic are immune to a Bard&rsquo;s Oratory.</p>

