system:
  description: >-
    <p>This spell creates a momentary beam of radiant light that damages
    creatures in a 5ft wide line in front of the Demon Hunter, to a distance of
    60ft. All creatures in the spell’s area of effect take 1d6 points of damage,
    and Chaotically-aligned creatures take an additional 1d6 points. In either
    case, a saving throw is allowed, in which case the target receives only half
    damage from the spell.</p>
