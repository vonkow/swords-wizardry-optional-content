system:
  description: >-
    <div class="page" title="Page 33">

    <div class="layoutArea">

    <div class="column">

    <p>The caster detects any malign enchantments and Chaos-alignment auras
    within the spell&rsquo;s range. Poison is not inherently evil and cannot be
    detected by means of this spell. The spell is similar to the second level
    Magic-User spell Detect Evil, but it is less sensitive, picking up only
    magical effects and actual align- ments rather than mere intentions. The
    Magic-User&rsquo;s second level <em>detect evil</em> spell may be copied
    into a Demon Hunter&rsquo;s spellbook as <em>detect chaos</em>, but there is
    a 25% chance that the copying attempt will fail, and the notes will not
    serve to memorize the spell.</p>

    </div>

    </div>

    </div>
