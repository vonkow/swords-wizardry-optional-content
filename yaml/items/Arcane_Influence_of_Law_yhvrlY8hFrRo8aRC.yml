  description: >-
    <div class="page" title="Page 11">

    <div class="layoutArea">

    <div class="column">

    <p>A Demon Hunter&rsquo;s spells are more effective against creatures of
    Chaos than those of a Magic-User or Cleric. Any Chaos-aligned or summoned
    creature with a magic resis- tance percentage has that magic resistance
    reduced by 10% against the spells of a Demon Hunter. For example, a demon
    with magic resistance of 25% targeted by a Demon Hunter&rsquo;s spell would
    have a 15% chance to avoid the spell effect rather than the ordinary 25%
    chance.</p>

