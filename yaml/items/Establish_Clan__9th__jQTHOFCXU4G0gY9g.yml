system:
  description: >-
    <div class="page" title="Page 6">

    <div class="layoutArea">

    <div class="column">

    <p>Upon reaching 9th level, a Barbarian&nbsp;earns the title of Chieftain,
    at which time 2d6+1 1st level Barbarians will track down the Chieftain and
    swear allegiance to the new clan. They will remain loyal followers as long
    as the Chieftain provides for&nbsp;their basic needs, takes them on regular
    raids, and provides ample&nbsp;opportunity for battle. A Chieftain who fails
    to do so may eventually&nbsp;be branded a coward, and betrayed or challenged
    for supremacy.</p>

    </div>

    </div>

    </div>
