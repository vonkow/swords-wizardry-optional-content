    <div class="layoutArea">

    <div class="column">

    <p>When this spell is cast, the Illusionist&rsquo;s eyes glaze over as if
    they were mirrors. Any creature or monster with a gaze attack (such as a
    medusa or basilisk) who comes within range of this spell and looks at the
    caster&rsquo;s face finds their gaze attack reflected upon themselves. The
    caster is immune to gaze attacks while this spell is active.</p>

