system:
  description: >-
    <div class="page" title="Page 13">

    <div class="layoutArea">

    <div class="column">

    <p>Whenever a Dwarven Priest retains the service of a hireling who is of
    dwarf ancestry, the upkeep and wage costs are reduced by 50%. Dwarven
    hirelings (ordinary non-character-type NPCs, not hired Fighters) of a
    Dwarven Priest fight with a +1 bonus to all attack rolls. They also receive
    a +2 on all saving throws made to avoid abandoning or betraying their
    service. Finally, the Dwarven Priest adds 1 to their maximum number of
    special hirelings, as long as those hirelings are dwarves.</p>

    </div>

